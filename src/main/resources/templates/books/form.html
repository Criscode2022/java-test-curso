<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head(${formTitle})}"></head>
<body>
    <div th:replace="~{layout :: room}"></div>
    <header th:replace="~{layout :: header}"></header>

    <main class="wrap narrow">
        <h1 th:text="${formTitle}">Add a book</h1>
        <p class="hint">Pick an author and a genre. This book will belong to you.</p>

        <form class="form" th:action="@{${formAction}}" th:object="${book}" method="post">
            <label>
                Title
                <input type="text" th:field="*{title}" maxlength="200" autocomplete="off">
                <span class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
            </label>

            <label>
                Author
                <select th:field="*{authorId}">
                    <option value="">Choose an author</option>
                    <option th:each="author : ${authors}" th:value="${author.id}" th:text="${author.name}">Author</option>
                </select>
                <span class="field-error" th:if="${#fields.hasErrors('authorId')}" th:errors="*{authorId}"></span>
            </label>
            <p class="hint"><a th:href="@{/authors/new}">Add an author</a></p>

            <label>
                Genre
                <select th:field="*{genreId}">
                    <option value="">Choose a genre</option>
                    <option th:each="genre : ${genres}" th:value="${genre.id}" th:text="${genre.name}">Genre</option>
                </select>
                <span class="field-error" th:if="${#fields.hasErrors('genreId')}" th:errors="*{genreId}"></span>
            </label>
            <p class="hint"><a th:href="@{/genres/new}">Add a genre</a></p>

            <div class="form-grid">
                <label>
                    ISBN
                    <input type="text" th:field="*{isbn}" maxlength="17" autocomplete="off">
                    <span class="field-error" th:if="${#fields.hasErrors('isbn')}" th:errors="*{isbn}"></span>
                </label>
                <label>
                    Year
                    <input type="number" th:field="*{publishedYear}" min="1400" max="2100">
                    <span class="field-error" th:if="${#fields.hasErrors('publishedYear')}" th:errors="*{publishedYear}"></span>
                </label>
                <label>
                    Pages
                    <input type="number" th:field="*{pages}" min="1" max="20000">
                    <span class="field-error" th:if="${#fields.hasErrors('pages')}" th:errors="*{pages}"></span>
                </label>
            </div>

            <div class="actions">
                <button type="submit" class="btn">Save book</button>
                <a class="text-btn" th:href="@{/books}">Cancel</a>
            </div>
        </form>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
