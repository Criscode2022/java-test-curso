<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head('Books')}"></head>
<body>
    <div th:replace="~{layout :: room}"></div>
    <header th:replace="~{layout :: header}"></header>
    <div th:replace="~{layout :: toast}"></div>

    <main class="wrap">
        <div class="section-row">
            <h1>Books</h1>
            <a class="btn" th:href="@{/books/new}">Add book</a>
        </div>

        <div class="filters" th:unless="${books.empty}">
            <label>
                Search
                <input type="search" data-filter-input placeholder="Title, author, ISBN…">
            </label>
            <label>
                Author
                <select data-filter-author>
                    <option value="all">All authors</option>
                    <option th:each="author : ${authors}"
                            th:value="${author.name}"
                            th:text="${author.name}">Author</option>
                </select>
            </label>
            <label>
                Genre
                <select data-filter-genre>
                    <option value="all">All genres</option>
                    <option th:each="genre : ${genres}"
                            th:value="${genre.name}"
                            th:text="${genre.name}">Genre</option>
                </select>
            </label>
            <p class="result" data-result-count></p>
        </div>

        <section class="empty" th:if="${books.empty}">
            <p>No books yet. Add an author and a genre first, then add a book.</p>
            <a class="btn" th:href="@{/authors/new}">Add author</a>
        </section>

        <div class="shelf" th:unless="${books.empty}">
            <div class="shelf-plank" aria-hidden="true"></div>
            <div class="cover-row" data-card-grid>
                <article class="book" data-book th:each="book, iter : ${books}"
                         th:attr="data-title=${book.title}, data-author=${book.authorName}, data-genre=${book.genreName}, data-isbn=${book.isbn}, data-cloth=${iter.index % 6}">
                    <a class="cover" th:href="@{/books/{id}(id=${book.id})}">
                        <span class="spine"></span>
                        <span class="band" th:text="${book.genreName}">Software</span>
                        <h3 th:text="${book.title}">Title</h3>
                        <p th:text="${book.authorName}">Author</p>
                        <small th:text="${book.publishedYear}">2008</small>
                    </a>
                    <div class="book-actions">
                        <a th:href="@{/books/{id}/edit(id=${book.id})}">Edit</a>
                        <form th:action="@{/books/{id}/delete(id=${book.id})}" method="post" data-confirm="Delete this book?">
                            <button type="submit">Delete</button>
                        </form>
                    </div>
                </article>
            </div>
        </div>
        <p class="empty" data-empty-filter hidden>No books match that search.</p>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
