<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head(${formTitle})}"></head>
<body>
    <div th:replace="~{layout :: room}"></div>
    <header th:replace="~{layout :: header}"></header>

    <main class="wrap narrow">
        <h1 th:text="${formTitle}">Add a genre</h1>
        <p class="hint">You need a genre before you can add a book to it.</p>

        <form class="form" th:action="@{${formAction}}" th:object="${genre}" method="post">
            <label>
                Name
                <input type="text" th:field="*{name}" maxlength="80" autocomplete="off">
                <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
            </label>
            <label>
                Description
                <input type="text" th:field="*{description}" maxlength="200" autocomplete="off">
                <span class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
            </label>
            <div class="actions">
                <button type="submit" class="btn">Save genre</button>
                <a class="text-btn" th:href="@{/genres}">Cancel</a>
            </div>
        </form>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
