<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head('Register')}"></head>
<body>
    <div th:replace="~{layout :: room}"></div>
    <header th:replace="~{layout :: header}"></header>

    <main class="wrap narrow">
        <h1>Create an account</h1>
        <p class="hint">Books you add will belong to you.</p>

        <form class="form" th:action="@{/register}" th:object="${register}" method="post">
            <label>
                Name
                <input type="text" th:field="*{name}" maxlength="80" autocomplete="name">
                <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
            </label>
            <label>
                Email
                <input type="email" th:field="*{email}" maxlength="180" autocomplete="email">
                <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </label>
            <label>
                Password
                <input type="password" th:field="*{password}" minlength="6" autocomplete="new-password">
                <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            </label>
            <div class="actions">
                <button type="submit" class="btn">Register</button>
                <a class="text-btn" th:href="@{/login}">I already have an account</a>
            </div>
        </form>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
