<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head('Sign in')}"></head>
<body>
    <div th:replace="~{layout :: room}"></div>
    <header th:replace="~{layout :: header}"></header>

    <main class="wrap narrow">
        <h1>Sign in</h1>
        <p class="hint">Use your Stacks account. Demo: librarian@stacks.local / stacks</p>

        <form class="form" th:action="@{/login}" th:object="${login}" method="post">
            <p class="field-error" th:if="${#fields.hasGlobalErrors()}"
               th:each="err : ${#fields.globalErrors()}" th:text="${err}">Wrong password.</p>
            <label>
                Email
                <input type="email" th:field="*{email}" autocomplete="username">
                <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </label>
            <label>
                Password
                <input type="password" th:field="*{password}" autocomplete="current-password">
                <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            </label>
            <div class="actions">
                <button type="submit" class="btn">Sign in</button>
                <a class="text-btn" th:href="@{/register}">Create an account</a>
            </div>
        </form>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
