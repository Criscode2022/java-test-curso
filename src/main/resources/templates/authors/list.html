<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head('Authors')}"></head>
<body>
    <div th:replace="~{layout :: room}"></div>
    <header th:replace="~{layout :: header}"></header>
    <div th:replace="~{layout :: toast}"></div>

    <main class="wrap">
        <div class="section-row">
            <h1>Authors</h1>
            <a class="btn" th:if="${currentUser != null}" th:href="@{/authors/new}">Add author</a>
        </div>

        <section class="empty" th:if="${authors.empty}">
            <p>No authors yet. Add one before you can add a book.</p>
            <a class="btn" th:href="@{/authors/new}">Add author</a>
        </section>

        <ul class="author-list" th:unless="${authors.empty}">
            <li th:each="author, iter : ${authors}">
                <a class="author-card" th:href="@{/authors/{id}(id=${author.id})}">
                    <span class="mini-spines" th:attr="data-cloth=${iter.index % 6}" aria-hidden="true">
                        <i></i><i></i><i></i>
                    </span>
                    <span>
                        <strong th:text="${author.name}">Name</strong>
                        <em th:text="${author.nationality} ?: 'Nationality unknown'">United States</em>
                    </span>
                    <span class="badge" th:text="|${author.bookCount} books|">2 books</span>
                </a>
                <div class="book-actions" th:if="${currentUser != null}">
                    <a th:href="@{/authors/{id}/edit(id=${author.id})}">Edit</a>
                    <form th:action="@{/authors/{id}/delete(id=${author.id})}" method="post"
                          data-confirm="Delete this author? You can only do this if they have no books.">
                        <button type="submit">Delete</button>
                    </form>
                </div>
            </li>
        </ul>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
