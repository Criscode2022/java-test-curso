<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head (pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' · Stacks'">Stacks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css?family=Fraunces:500,600,700|Lexend:400,500,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <div class="room" th:fragment="room" aria-hidden="true"></div>

    <header class="topbar" th:fragment="header">
        <a class="logo" th:href="@{/}">
            <span class="logo-books" aria-hidden="true"></span>
            Stacks
        </a>
        <nav>
            <a th:href="@{/books}">Books</a>
            <a th:href="@{/authors}">Authors</a>
            <a class="btn" th:href="@{/books/new}">Add book</a>
        </nav>
    </header>

    <div class="notice" th:fragment="toast" th:if="${message}" data-toast th:text="${message}">Saved.</div>

    <footer class="site-foot" th:fragment="footer">
        <p>Every book needs an author. API: <a th:href="@{/api/books}">/api/books</a></p>
        <script th:src="@{/js/archive.js}"></script>
    </footer>
</body>
</html>
