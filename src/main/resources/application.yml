spring:
  application:
    name: library

  config:
    import: optional:file:.env[.properties]

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

library:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-use-at-least-32-bytes!}
    expiration: 12h
    cookie-name: access_token
